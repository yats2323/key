services:
  - type: web
    name: framecut-discord-license
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: license-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        value: "1559756715120132116"
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: LICENSE_PRIVATE_XML
        sync: false
      - key: DATA_FILE
        value: /var/data/licenses.json
